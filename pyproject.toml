[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight"
version = "1.0.0"
description = "AI-Powered Demand & Inventory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "FORESIGHT Technical Lead" }]
dependencies = [
  "pandas>=2.2.0,<3.0.0",
  "numpy>=1.26.0,<2.0.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.4.0",
  "statsmodels>=0.14.0",
  "scipy>=1.12.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.6.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "streamlit>=1.32.0",
  "plotly>=5.19.0",
  "joblib>=1.3.2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]
notebooks = ["ipykernel>=6.29.0", "nbformat>=5.9.0", "nbclient>=0.10.0", "ipywidgets>=8.1.0"]
lgbm = ["lightgbm>=4.3.0"]

[project.scripts]
foresight = "foresight.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "api", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
